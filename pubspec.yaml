name: qr_toolkit
description: "QR Toolkit - Modern QR code scanner, generator and designer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0
  get_it: ^8.0.2

  # Routing
  go_router: ^14.6.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # QR / Scanning
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # UI / Animation
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  share_plus: ^10.0.2

  # Device / Platform
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  local_auth: ^2.2.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

  # Export
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/illustrations/
    - assets/animations/
    - assets/lottie/
    - assets/fonts/
    - assets/translations/
